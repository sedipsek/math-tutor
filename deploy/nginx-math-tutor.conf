# HTTP — ACME + HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name math.chikenmoo.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — math-tutor
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name math.chikenmoo.dev;

    ssl_certificate     /etc/letsencrypt/live/math.chikenmoo.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/math.chikenmoo.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # Cloudflare Always HTTPS → LE가 여기로 따라옴
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 스캐너 단골 경로 — SPA 폴백으로 200 주지 않음
    location ~* ^/(\.env|\.git|node_modules|package(-lock)?\.json|tsconfig\.json|drizzle\.config\.ts) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Connection "";

        # SSE / 긴 생성
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
