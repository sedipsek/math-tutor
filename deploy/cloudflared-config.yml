# Pi 전용 터널 (chikenmoo-pi). credentials는 호스트 ~/.cloudflared 에만 둔다.
tunnel: 274c18e5-989b-46b2-aa64-d96930b63461
credentials-file: /home/pi/.cloudflared/274c18e5-989b-46b2-aa64-d96930b63461.json

ingress:
  - hostname: math.chikenmoo.dev
    service: https://127.0.0.1:443
    originRequest:
      # origin이 127.0.0.1 이라 인증서 SAN 불일치 → 로컬만 검증 생략
      noTLSVerify: true
      # SSE / 긴 LLM 생성
      connectTimeout: 30s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
      httpHostHeader: math.chikenmoo.dev

  - service: http_status:404
